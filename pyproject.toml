[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gpu-analytics-engine"
version = "0.1.0"
description = "A local-first engine for streaming Parquet datasets larger than GPU memory through a single consumer NVIDIA GPU."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0,<3",
    # Upper bound matches cuDF 26.08's constraint, so CPU-only and GPU installs
    # resolve to the same pyarrow. Revisit when upgrading RAPIDS.
    "pyarrow>=19,<24",
    # NVML bindings: lets `inspect-gpu` report the driver/CUDA version *before*
    # cuDF is installed, which is how you choose between cu12 and cu13 wheels.
    "nvidia-ml-py>=12.535",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Choose one, based on the CUDA version your driver reports (see docs/environment.md).
gpu-cu12 = ["cudf-cu12==26.8.*"]
gpu-cu13 = ["cudf-cu13==26.8.*"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires an NVIDIA GPU with cuDF installed (skipped otherwise)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
